name: Payment Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean package --batch-mode -DskipTests=false
      - name: Run unit tests
        run: mvn test --batch-mode
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build JAR
        run: mvn clean package --batch-mode -DskipTests=true
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            adwivedi9/payment-service:latest
            adwivedi9/payment-service:${{ github.sha }}

  smoke-test:
    name: Smoke Test and Health Check
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run smoke tests against Docker Hub image
        run: |
          docker pull adwivedi9/payment-service:${{ github.sha }}
          docker run -d -p 8080:8080 \
            --name payment-smoke \
            adwivedi9/payment-service:${{ github.sha }}
          echo "==> Waiting 40s for Spring Boot to start..."
          sleep 40
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh http://localhost:8080
      - name: Rollback on failure
        if: failure()
        run: |
          echo "==> SMOKE TEST FAILED"
          echo "==> In production this would trigger: kubectl rollout undo"
          echo "==> Stopping failed container..."
          docker stop payment-smoke || true
          docker rm payment-smoke || true
          exit 1
      - name: Cleanup
        if: always()
        run: |
          docker stop payment-smoke || true
          docker rm payment-smoke || true

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-push, smoke-test]
    if: always()
    steps:
      - name: Notify success
        if: needs.smoke-test.result == 'success'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *payment-service* deploy SUCCESS",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *payment-service* deploy *SUCCESS*\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      - name: Notify failure
        if: needs.smoke-test.result == 'failure' || needs.docker-build-push.result == 'failure' || needs.build-and-test.result == 'failure'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *payment-service* deploy FAILED",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *payment-service* deploy *FAILED*\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
